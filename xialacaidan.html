<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dropdowm {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background-color: aquamarine;
            color: aliceblue;
            padding: 16px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .dropdowm-content {
            position: absolute;
            background-color: azure;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            display: none;
        }
        .aaa {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        .dropdowm-content a:hover {
            background-color: antiquewhite;
            color: aqua;
        }
        .dropdowm:hover .dropdowm-content {
            display: block;
        }
        .dropdowm:hover .dropbtn {
            background-color: brown;
            color: blue;
        }
    </style>
</head>

<body>
    <h2>下拉菜单</h2>
    <p>duiwdiuewhuidhe</p>
    <div class="dropdowm">
        <a href="#" class="aaa">链接1</a>
        <a href="#" class="aaa">链接2</a>
        <a href="#" class="aaa">链接3</a>
    </div>
</body>
</html>
